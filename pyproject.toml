[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-sentinel"
version = "1.0.0"
description = "Monitor and protect a Raspberry Pi from Discord"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7",
    "psutil>=7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pi-sentinel = "pi_sentinel.__main__:main"

[tool.setuptools]
packages = ["pi_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
